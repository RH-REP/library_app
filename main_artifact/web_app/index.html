<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Raw Text Pipeline Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17191c;
        --panel: #22262b;
        --panel-2: #1d2126;
        --panel-3: #15181b;
        --line: #3a4149;
        --line-soft: #2f363d;
        --text: #eceff2;
        --muted: #aab3bd;
        --muted-2: #7f8a95;
        --accent: #4fb286;
        --accent-soft: rgba(79, 178, 134, .16);
        --amber: #d7ba7d;
        --blue: #8cc8ff;
        --red: #d86f6f;
        --code: #111315;
        --focus: #66a9e8;
        --shadow: 0 18px 44px rgba(0, 0, 0, .3);
      }

      * { box-sizing: border-box; }

      html,
      body { height: 100%; }

      body {
        margin: 0;
        min-width: 320px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea { font: inherit; }

      button { color: inherit; }

      .app-shell {
        display: grid;
        grid-template-columns: clamp(320px, 30vw, 460px) minmax(0, 1fr);
        height: 100dvh;
        overflow: hidden;
      }

      .sidebar {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: hidden;
      }

      .workspace-bar {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line-soft);
        background: #1c2024;
      }

      .workspace-mark {
        width: 18px;
        height: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        flex: 0 0 auto;
      }

      .workspace-mark span {
        border: 1px solid rgba(236, 239, 242, .42);
        background: rgba(79, 178, 134, .2);
      }

      .workspace-title {
        min-width: 0;
        flex: 1 1 auto;
        color: #d9dee3;
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .icon-button {
        width: 30px;
        height: 30px;
        border: 1px solid transparent;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover,
      .icon-button.is-active {
        border-color: #46505a;
        background: #343b43;
        color: var(--text);
      }

      .icon-button svg,
      .tree-icon svg,
      .tree-expander svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .filter-panel {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }

      .search-wrap { position: relative; }

      .search-wrap svg {
        position: absolute;
        top: 50%;
        left: 10px;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        color: var(--muted-2);
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
      }

      .search-input,
      .filter-select,
      .tag-input,
      .raw-text {
        width: 100%;
        border: 1px solid #434b54;
        border-radius: 6px;
        background: #171a1e;
        color: var(--text);
        outline: 0;
      }

      .search-input {
        height: 34px;
        padding: 0 10px 0 34px;
      }

      .search-input:focus,
      .filter-select:focus,
      .tag-input:focus,
      .raw-text:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 2px rgba(102, 169, 232, .22);
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
      }

      .filter-select {
        height: 32px;
        padding: 0 8px;
      }

      .tree-heading {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        border-bottom: 1px solid var(--line-soft);
        background: #242930;
        color: #d8dee5;
        font-size: 12px;
        font-weight: 700;
      }

      .match-count {
        color: var(--muted-2);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      .tree {
        min-height: 0;
        overflow: auto;
        padding: 6px 6px 16px;
      }

      .tree-item {
        width: 100%;
        min-height: 30px;
        display: grid;
        grid-template-columns: 18px 18px minmax(0, 1fr) auto;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 3px 8px 3px calc(8px + var(--depth) * 16px);
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
      }

      .tree-item:hover,
      .tree-item.is-selected {
        background: #30363d;
        color: var(--text);
      }

      .tree-item.is-selected {
        border-color: rgba(79, 178, 134, .72);
        background: var(--accent-soft);
      }

      .tree-expander {
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        color: var(--muted-2);
      }

      .tree-icon { color: var(--amber); }
      .tree-icon.file { color: var(--blue); }

      .tree-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kind-pill {
        min-width: 54px;
        border: 1px solid rgba(170, 179, 189, .22);
        border-radius: 999px;
        padding: 1px 7px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }

      .content {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
        background: #191c20;
      }

      .tab-strip {
        min-height: 38px;
        display: flex;
        align-items: end;
        padding: 0 12px;
        border-bottom: 1px solid var(--line-soft);
        background: #15181b;
      }

      .tab {
        min-width: 180px;
        max-width: 460px;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-soft);
        border-bottom-color: #191c20;
        border-radius: 6px 6px 0 0;
        padding: 0 11px;
        background: #191c20;
        color: var(--text);
        font-size: 13px;
      }

      .tab span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .document-bar {
        min-height: 92px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--panel-2);
      }

      .document-title {
        margin: 0;
        color: var(--text);
        font-size: 20px;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .document-path,
      .document-summary {
        margin-top: 4px;
        color: var(--muted-2);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .document-tools {
        margin-top: 10px;
        display: grid;
        grid-template-columns: minmax(180px, 360px) auto;
        gap: 8px;
        align-items: center;
      }

      .tag-input {
        height: 30px;
        padding: 0 9px;
        font-size: 12px;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        justify-content: flex-end;
      }

      .badge {
        border: 1px solid rgba(170, 179, 189, .25);
        border-radius: 999px;
        padding: 2px 8px;
        color: var(--muted);
        background: rgba(255, 255, 255, .03);
        font-size: 12px;
      }

      .badge.accent {
        border-color: rgba(79, 178, 134, .45);
        background: rgba(79, 178, 134, .13);
        color: #dffff2;
      }

      .viewer {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(350px, .72fr);
        overflow: hidden;
      }

      .preview-pane,
      .raw-pane {
        min-width: 0;
        min-height: 0;
        overflow: auto;
      }

      .preview-pane { padding: 22px 26px 80px; }

      .raw-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        border-left: 1px solid var(--line-soft);
        background: var(--panel-3);
      }

      .raw-header {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 12px;
      }

      .raw-titleline,
      .raw-actions {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dirty-state {
        color: var(--amber);
        white-space: nowrap;
      }

      .small-button {
        height: 26px;
        border: 1px solid #46505a;
        border-radius: 6px;
        padding: 0 9px;
        background: #20262c;
        color: #dce2e8;
        cursor: pointer;
        font-size: 12px;
      }

      .small-button:hover:not(:disabled) {
        border-color: rgba(79, 178, 134, .65);
        background: #27322e;
      }

      .small-button:disabled {
        cursor: not-allowed;
        opacity: .45;
      }

      .raw-text {
        min-height: 0;
        resize: none;
        border: 0;
        border-radius: 0;
        padding: 18px;
        background: #121416;
        color: #e9edf1;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.65;
      }

      .pipeline {
        max-width: 980px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 18px;
      }

      .pipeline-step {
        min-width: 0;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        padding: 10px;
        background: #1d2227;
        text-align: left;
      }

      button.pipeline-step { cursor: pointer; }
      button.pipeline-step:hover { border-color: #52606d; background: #252b31; }

      .pipeline-step.is-current {
        border-color: rgba(79, 178, 134, .62);
        background: var(--accent-soft);
      }

      .pipeline-label {
        color: var(--muted-2);
        font-size: 11px;
      }

      .pipeline-path {
        margin-top: 4px;
        color: #dce2e8;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .metadata-panel,
      .preview-tool,
      .code-panel {
        max-width: 980px;
        border: 1px solid rgba(79, 178, 134, .35);
        border-radius: 8px;
        margin-bottom: 18px;
        overflow: hidden;
        background: rgba(79, 178, 134, .08);
        box-shadow: var(--shadow);
      }

      .metadata-title,
      .tool-header,
      .code-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 38px;
        padding: 0 12px;
        border-bottom: 1px solid rgba(79, 178, 134, .28);
        color: #dffff2;
        font-size: 12px;
        font-weight: 700;
      }

      .metadata-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metadata-field {
        min-width: 0;
        border-right: 1px solid rgba(79, 178, 134, .2);
        border-bottom: 1px solid rgba(79, 178, 134, .18);
        padding: 10px 12px;
      }

      .metadata-field:nth-child(2n) { border-right: 0; }

      .metadata-key {
        color: var(--muted-2);
        font-size: 11px;
      }

      .metadata-value {
        margin-top: 2px;
        color: var(--text);
        overflow-wrap: anywhere;
      }

      .tool-body {
        padding: 14px;
        background: #171b1f;
      }

      .html-frame,
      .pdf-frame {
        width: 100%;
        min-height: 520px;
        border: 1px solid #303941;
        border-radius: 7px;
        background: #ffffff;
      }

      .image-preview {
        width: 100%;
        height: auto;
        max-height: 620px;
        object-fit: contain;
        border: 1px solid #303941;
        border-radius: 7px;
        background: #101316;
      }

      .binary-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .markdown,
      .code-panel { max-width: 980px; }

      .markdown h1,
      .markdown h2,
      .markdown h3 {
        margin: 1.2em 0 .55em;
        color: #f3f6f9;
        line-height: 1.28;
      }

      .markdown h1:first-child,
      .markdown h2:first-child,
      .markdown h3:first-child { margin-top: 0; }

      .markdown h1 { font-size: 28px; }
      .markdown h2 { font-size: 21px; }
      .markdown h3 { font-size: 16px; }

      .markdown p {
        margin: .7em 0;
        color: #dce2e8;
      }

      .markdown ul,
      .markdown ol {
        margin: .65em 0 .9em;
        padding-left: 1.4em;
      }

      .markdown li { margin: .26em 0; }

      .markdown code {
        border: 1px solid #303941;
        border-radius: 4px;
        padding: .1em .35em;
        background: var(--code);
        color: #e9d9a8;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: .92em;
      }

      .markdown pre,
      .code-block {
        overflow: auto;
        border: 1px solid #303941;
        border-radius: 7px;
        padding: 14px;
        background: var(--code);
        color: #e9edf1;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.65;
        box-shadow: var(--shadow);
      }

      .markdown pre code {
        border: 0;
        padding: 0;
        background: transparent;
        color: #e9edf1;
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (max-width: 1120px) {
        .viewer { grid-template-columns: minmax(0, 1fr); }
        .raw-pane {
          border-top: 1px solid var(--line-soft);
          border-left: 0;
          min-height: 360px;
        }
      }

      @media (max-width: 760px) {
        body { overflow: auto; }
        .app-shell {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(320px, 44dvh) minmax(560px, 56dvh);
          height: auto;
          min-height: 100dvh;
          overflow: visible;
        }
        .document-bar { grid-template-columns: 1fr; }
        .document-tools { grid-template-columns: 1fr; }
        .badge-row { justify-content: flex-start; }
        .metadata-grid,
        .pipeline { grid-template-columns: 1fr; }
        .metadata-field { border-right: 0; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="フォルダツリー">
        <div class="workspace-bar">
          <div class="workspace-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <div class="workspace-title">source_extracted_organized_viewer</div>
          <button id="expandAllButton" class="icon-button" type="button" title="Expand All" aria-label="Expand All">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16"/><path d="M4 15h16"/><path d="m8 5 4 4 4-4"/><path d="m8 19 4-4 4 4"/></svg>
          </button>
          <button id="collapseAllButton" class="icon-button" type="button" title="Collapse All" aria-label="Collapse All">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16"/><path d="M4 15h16"/><path d="m8 9 4-4 4 4"/><path d="m8 15 4 4 4-4"/></svg>
          </button>
        </div>

        <div class="filter-panel">
          <label class="search-wrap" for="searchInput">
            <span class="visually-hidden">Search</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
            <input id="searchInput" class="search-input" type="search" autocomplete="off" placeholder="Search file, stage, tag">
          </label>
          <div class="filter-grid">
            <label>
              <span class="visually-hidden">Kind</span>
              <select id="kindFilter" class="filter-select" aria-label="Kind"></select>
            </label>
            <label>
              <span class="visually-hidden">Tag</span>
              <select id="tagFilter" class="filter-select" aria-label="Tag"></select>
            </label>
            <label>
              <span class="visually-hidden">Status</span>
              <select id="statusFilter" class="filter-select" aria-label="Status"></select>
            </label>
          </div>
        </div>

        <div class="tree-heading">
          <span>Explorer</span>
          <span id="matchCount" class="match-count"></span>
        </div>
        <nav id="tree" class="tree" aria-label="Explorer"></nav>
      </aside>

      <main class="content" data-screen="viewer.document">
        <div class="tab-strip">
          <div class="tab">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span id="activeTab">index.md</span>
          </div>
        </div>

        <header class="document-bar">
          <div>
            <h1 id="documentTitle" class="document-title"></h1>
            <div id="documentPath" class="document-path"></div>
            <div id="documentSummary" class="document-summary"></div>
            <div class="document-tools">
              <label>
                <span class="visually-hidden">Tags</span>
                <input id="tagInput" class="tag-input" type="text" autocomplete="off">
              </label>
              <button id="applyTagsButton" class="small-button" type="button">Apply tags</button>
            </div>
          </div>
          <div id="badgeRow" class="badge-row"></div>
        </header>

        <section class="viewer" aria-live="polite">
          <article id="previewPane" class="preview-pane"></article>
          <section class="raw-pane">
            <div class="raw-header">
              <div class="raw-titleline">
                <span id="rawLabel"></span>
                <span id="dirtyState" class="dirty-state"></span>
              </div>
              <div class="raw-actions">
                <button id="addMemoButton" class="small-button" type="button">Add memo</button>
                <button id="saveEditButton" class="small-button" type="button">Save edit</button>
                <button id="resetEditButton" class="small-button" type="button">Reset</button>
                <span id="updatedAt"></span>
              </div>
            </div>
            <textarea id="rawText" class="raw-text" spellcheck="false"></textarea>
          </section>
        </section>
      </main>
    </div>

    <script>
      const fileData = [
        {
                "path": "source_data/requirements_note_html/original/requirements_note.html",
                "title": "Minimum Library Feature Note / HTML Source",

                "summary": "原本 source_data。抽出前の PDF、JPG、HTML を保持する。",
                "sourceChain": [
                        [
                                "source_data",
                                "source_data/requirements_note_html/original/requirements_note.html"

                        [
                                "raw_text",
                                "extracted_data/requirements_note_html/raw_text.txt"

                        [

                                "organized_data",
                                "organized_data/requirements_note/index.md"

                "content": "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Minimum library feature note</title>\n  <style>nav, footer { color: #777; }</style>\n</head>\n<body>\n  <nav>Home | Tags | Folder map | Import queue</nav>\n  <main>\n    <article>\n      <h1>Minimum library feature note</h1>\n      <p>The alpha library should accept a source file, keep the original file path, extract readable text, and create one searchable organized_data entry.</p>\n      <h2>Required behavior</h2>\n      <ul>\n        <li>Keep source files separate from software code.</li>\n        <li>Create <code>raw_text.txt</code> for search.</li>\n        <li>Keep metadata in <code>extraction_record.json</code> and <code>source_refs.json</code>.</li>\n        <li>Add a human-readable metadata header only to organized <code>index.md</code>.</li>\n      </ul>\n      <h2>Non-goal</h2>\n      <p>The alpha does not need automatic summarization or perfect OCR.</p>\n    </article>\n  </main>\n  <footer>Demo footer that the extractor should treat as navigation noise.</footer>\n</body>\n</html>\n",
                "mediaType": "text/html",
                "searchText": "text/html source_data raw_text extracted_text organized_data"
        },
        {
                "path": "extracted_data/requirements_note_html/raw_text.txt",
                "title": "Minimum Library Feature Note / raw_text.txt",
                "kind": "raw_text",
                "renderer": "text",
                "tags": [
                        "alpha",
                        "requirements",
                        "html",
                        "raw_text",
                        "editable",
                        "extracted_data"
                ],
                "status": "editable",

        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        if (lines[0] !== '""""""') return { metadata: [], body: markdown };
        const endIndex = lines.findIndex((line, index) => index > 0 && line === '""""""');
        if (endIndex < 0) return { metadata: [], body: markdown };
        const metadata = lines.slice(1, endIndex).map((line) => {
          const separator = line.indexOf("：");
          if (separator < 0) return ["", line];
          return [line.slice(0, separator), line.slice(separator + 1)];

        return { metadata, body: lines.slice(endIndex + 1).join("\n") };

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let index = 0;

        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) {
            index += 1;
            continue;
          }

          if (line.startsWith("```")) {
            const code = [];
            index += 1;
            while (index < lines.length && !lines[index].startsWith("```")) {
              code.push(lines[index]);
              index += 1;
            }
            index += 1;
            html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            index += 1;
            continue;
          }

          if (/^-\s+/.test(line)) {
            const items = [];
            while (index < lines.length && /^-\s+/.test(lines[index])) {
              items.push(`<li>${inlineMarkdown(lines[index].replace(/^-\s+/, ""))}</li>`);
              index += 1;
            }
            html.push(`<ul>${items.join("")}</ul>`);
            continue;
          }

          if (/^\d+\.\s+/.test(line)) {
            const items = [];
            while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
              items.push(`<li>${inlineMarkdown(lines[index].replace(/^\d+\.\s+/, ""))}</li>`);
              index += 1;
            }
            html.push(`<ol>${items.join("")}</ol>`);
            continue;
          }

          const paragraph = [];
          while (
            index < lines.length &&
            lines[index].trim() &&
            !lines[index].startsWith("```") &&
            !/^(#{1,3})\s+/.test(lines[index]) &&
            !/^-\s+/.test(lines[index]) &&
            !/^\d+\.\s+/.test(lines[index])
          ) {
            paragraph.push(lines[index]);
            index += 1;
          }
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        }

        return html.join("\n");
      }

        if (el.status.value !== "all" && item.status !== el.status.value) return false;

        return [item.path, item.title, item.kind, item.status, item.summary, item.tags.join(" "), item.searchText || "", item.content]

      function buildTree(files) {
        const root = { name: "", path: "", type: "folder", children: new Map() };
        files.forEach((file) => {

          let cursor = root;
          parts.forEach((part, index) => {
            const currentPath = parts.slice(0, index + 1).join("/");
            if (!cursor.children.has(part)) {
              cursor.children.set(part, {
                name: part,
                path: currentPath,
                type: index === parts.length - 1 ? "file" : "folder",
                children: new Map(),
                file: index === parts.length - 1 ? file : null
              });
            }
            cursor = cursor.children.get(part);
          });

      renderTree();
      renderDocument();

      [el.search, el.kind, el.tag, el.status].forEach((control) => {
        control.addEventListener("input", () => {
          renderTree();
          renderDocument();
        });
      });
      el.rawText.addEventListener("input", markCurrentDirty);
      el.tagInput.addEventListener("input", () => updateEditControls(currentFile()));
      el.tagInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          applyTagEdit();
        }
      });
      el.applyTags.addEventListener("click", applyTagEdit);
      el.addMemo.addEventListener("click", appendOrganizedMemo);
      el.saveEdit.addEventListener("click", saveCurrentEdit);
      el.resetEdit.addEventListener("click", resetCurrentEdit);
      el.expandAll.addEventListener("click", expandAll);
      el.collapseAll.addEventListener("click", collapseAll);
    </script>

        isPublic: true,
        getContext: () => ({ summary: `開いているファイル: ${document.getElementById("activeTab")?.textContent || "（なし）"}` }),
      });
    </script>
